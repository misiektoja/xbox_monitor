[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xbox_monitor"
version = "2.0.1"
description = "Tool implementing real-time tracking of Xbox Live players activities"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "Michal Szymanski", email = "misiektoja-pypi@rm-rf.ninja" }]
requires-python = ">=3.11"
dependencies = [
  "python-xbox>=0.1.3",
  "python-dateutil>=2.8",
  "httpx>=0.26.0",
  "pytz>=2020.1",
  "tzlocal>=4.0",
  "python-dotenv>=1.2.2",
  "wcwidth>=0.2.7",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
]
keywords = ["xbox", "xbox-live","monitoring", "tracking", "real-time", "osint", "python-xbox"]

[project.optional-dependencies]
test = ["pytest>=9.0.3", "pyyaml>=6.0"]
# Pinned so a new ruff release cannot fail CI on a rule that did not exist when the change was written
lint = ["ruff==0.16.7"]

[project.urls]
Homepage = "https://github.com/misiektoja/xbox_monitor"
Source   = "https://github.com/misiektoja/xbox_monitor"
Changelog= "https://github.com/misiektoja/xbox_monitor/blob/main/RELEASE_NOTES.md"

[project.scripts]
xbox_monitor = "xbox_monitor:main"

[tool.setuptools]
py-modules = ["xbox_monitor"]
include-package-data = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Defect rules only: syntax errors, pyflakes and bugbear. Formatting and import order are left
# to the surrounding code, which keeps each function definition on one physical line
select = ["E9", "F", "B"]
# Both are style preferences that would rewrite hundreds of existing lines without fixing a defect
ignore = ["F541", "B904"]

[tool.pytest.ini_options]
# Run the in-repo source, never an installed copy, by putting the project root first on sys.path
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
